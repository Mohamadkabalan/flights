services:
  app:
    build: { context: ., dockerfile: Dockerfile }
    image: flight-api/app
    entrypoint: ['bash', 'docker/entrypoint.sh']
    command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000']
    ports:
      - '${APP_PORT:-80}:8000'
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379