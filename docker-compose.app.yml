services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flight-api/app
    # No entrypoint/command override needed anymore — the Dockerfile's
    # own CMD (supervisord running nginx + php-fpm) is correct as-is.
    ports:
      - '${APP_PORT:-80}:80'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flight